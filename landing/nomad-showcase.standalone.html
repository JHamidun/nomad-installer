<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomad — интерфейс приложения</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
:root{
  --ink:#111111; --line:#E4E4E7; --cream:#F4F4F5; --bezel:#10121f; --screen-bg:#FFFFFF;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;}
body{font-family:var(--sans);display:flex;align-items:center;justify-content:center;}

.stagewrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;}
.stage{display:flex;align-items:flex-start;justify-content:center;gap:clamp(18px,3vw,38px);width:100%;padding:0 60px;}

/* ── ноутбук: тёмный бэзел как у мокапа установщика ── */
.laptop{width:min(680px,54vw);}
.laptop__screen{border:10px solid var(--bezel);border-bottom-width:14px;border-radius:16px 16px 0 0;
  overflow:hidden;background:var(--screen-bg);
  box-shadow:0 18px 44px -26px rgba(7,9,38,.45),0 0 0 1px rgba(255,255,255,.07);}
.laptop__base{height:15px;background:linear-gradient(#212539,#0d0f1c);border-radius:0 0 14px 14px;
  margin:0 -22px;position:relative;box-shadow:0 10px 22px -14px rgba(7,9,38,.45);}
.laptop__base::after{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:104px;height:6px;border-radius:0 0 8px 8px;background:#0a0c16;}

/* ── смартфон: экраны Nomad уже с собственной рамкой телефона — без второго бэзеля ── */
.phone{width:min(270px,22vw);}
.phone__frame{border:none;border-radius:0;overflow:visible;background:transparent;box-shadow:none;}

/* scaled iframes (desk native 1196x862, phone 344x700) */
.scaler{overflow:hidden;background:var(--screen-bg);}
.scaler.phone{background:transparent;}
.scaler iframe{border:0;display:block;transform-origin:top left;background:transparent;}
.scaler.desk iframe{width:1196px;height:862px;}
.scaler.phone iframe{width:440px;height:740px;}

/* стрелки */
.navarrow{position:absolute;top:44%;transform:translateY(-50%);z-index:6;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:24px;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(70,45,20,.16);
  transition:transform .15s ease,background .15s ease;-webkit-user-select:none;user-select:none;}
.navarrow:hover{background:var(--cream);transform:translateY(-50%) scale(1.07);}
.navarrow--prev{left:16px;}
.navarrow--next{right:16px;}

/* вкладки-пункты */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 56px 16px;}
.tab{font-size:14px;padding:8px 16px;border-radius:22px;border:1px solid #D4D4D8;background:#FFFFFF;
  color:#52525B;cursor:pointer;transition:.18s;-webkit-user-select:none;user-select:none;font-family:var(--sans);}
.tab:hover{border-color:#111111;color:var(--ink);}
.tab.on{background:var(--ink);color:var(--cream);border-color:var(--ink);}
@media(max-width:680px){.tab{font-size:12.5px;padding:6px 12px;}}

.hidden{display:none !important;}

@media(max-width:680px){
  /* мобила: обе версии стопкой — ноутбук сверху, телефон под ним */
  .stage{padding:0 44px;flex-direction:column;align-items:center;gap:20px;}
  .laptop{width:calc(100% - 8px);}
  .phone{width:min(60vw, 240px);}
  .navarrow{width:36px;height:36px;font-size:20px;top:30%;}
}
</style>

    var bin=atob(b), bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  var SCREENS = [

  var ifD=document.getElementById('if-desk'), ifP=document.getElementById('if-phone');
  var sD=document.getElementById('scalerD'), sP=document.getElementById('scalerP');
  var phoneWrap=document.getElementById('phoneWrap');
  var tabs=document.getElementById('tabs');

  function fit(){
    var s1=sD.clientWidth/1196; sD.style.height=(862*s1)+'px'; ifD.style.transform='scale('+s1+')';
    // Канвас телефона 440x740: устройство 300x656 центрировано (flex в mobile-файле),
    // поля ~70px по бокам + низ — под ambient-тень (раньше тень резалась краем iframe,
    // а устройство было прижато влево → «смещение»). Высоту устройства (656) привязываем
    // к высоте ноутбука; масштаб — аналитически, без чтения layout (гонки со stale).
    var PCW=440, PCH=740;
    var lap=document.querySelector('.laptop');
    var s2;
    if(lap && lap.offsetParent!==null){
      var lapH=lap.getBoundingClientRect().height;
      s2=lapH/656;
      // скейлер тоже несёт класс .phone (=min(270px,22vw)) — на широком канвасе
      // он бы обрезал правый край, поэтому ширину задаём явно = ширине iframe*s2.
      phoneWrap.style.width=(PCW*s2)+'px';
      sP.style.width=(PCW*s2)+'px';
    } else {
      phoneWrap.style.width=''; sP.style.width='';
      s2=sP.clientWidth/PCW;
    }
    sP.style.height=(PCH*s2)+'px'; ifP.style.transform='scale('+s2+')';
  }

  var V='?v=218'; // cache-bust экранов (mobile-файлы обновлены: центрирование устройства)
  var curIdx=0;
  function show(i){
    curIdx=((i%SCREENS.length)+SCREENS.length)%SCREENS.length;
    var s=SCREENS[curIdx];
    ifD.srcdoc=SC(s.desk);
    if(s.phone){ phoneWrap.classList.remove('hidden'); ifP.srcdoc=SC(s.phone); }
    else { phoneWrap.classList.add('hidden'); ifP.removeAttribute('srcdoc'); }
    setTimeout(function(){ try{ var fs=document.getElementsByTagName('iframe'); for(var k=0;k<fs.length;k++) if(fs[k].contentWindow) fs[k].contentWindow.postMessage({hcLang:document.documentElement.lang||'ru'},'*'); }catch(e){} }, 120);
    [].forEach.call(tabs.children,function(t,j){ t.classList.toggle('on',j===curIdx); });
    fit();
  }
  SCREENS.forEach(function(s,i){
    var t=document.createElement('div'); t.className='tab'; t.textContent=s.name;
    t.onclick=function(){ show(i); }; tabs.appendChild(t);
  });
  document.getElementById('navPrev').onclick=function(){ show(curIdx-1); };
  document.getElementById('navNext').onclick=function(){ show(curIdx+1); };
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') show(curIdx-1); else if(e.key==='ArrowRight') show(curIdx+1);
  });
  window.addEventListener('resize',fit);
  show(0);
