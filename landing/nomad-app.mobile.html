.nmm,.nmm *,.nmm *::before,.nmm *::after{box-sizing:border-box;}
.nmm{
  --cream:#FFFFFF; --cream-2:#F4F4F5; --card:#FFFFFF; --line:#E4E4E7; --line-2:#D4D4D8;
  --ink:#111111; --muted:#52525B; --faint:#71717A; --terra:#111111;
  --blue-1:#111111; --blue-2:#111111; --green:#059669;
  --mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-family:var(--sans); color:var(--ink);
  display:inline-block;
}
.nmm__device{ width:300px; border-radius:44px; padding:12px; background:linear-gradient(160deg,#2b2620,#0e0c09);
  box-shadow:0 40px 90px -30px rgba(50,35,15,.6), 0 8px 30px -12px rgba(0,0,0,.4); }
.nmm__screen{ position:relative; border-radius:33px; overflow:hidden; background:var(--cream); height:632px; display:flex; flex-direction:column; }
.nmm__island{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:88px; height:22px; background:#000; border-radius:13px; z-index:6; }
.nmm__ic{ display:block; stroke:currentColor; fill:none; stroke-width:1.7; }

.nmm__status{ display:flex; justify-content:space-between; align-items:center; padding:9px 20px 3px; font:11px var(--mono); color:var(--muted); }
.nmm__head{ display:flex; align-items:center; gap:10px; padding:8px 16px 12px; border-bottom:1px solid var(--line); }
.nmm__head .mk{ width:24px; height:24px; }
.nmm__head .nm{ font-family:'Collapse',Georgia,serif; font-size:19px; background:linear-gradient(96deg,var(--blue-1),var(--blue-2)); -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:.02em; }
.nmm__head .r{ margin-left:auto; display:flex; gap:14px; color:var(--muted); }
.nmm__head .r .nmm__ic{ width:19px; height:19px; }

.nmm__body{ flex:1; overflow:hidden; display:flex; flex-direction:column; padding:20px 16px 12px; }
.nmm__word{ text-align:center; font-family:'Collapse',Georgia,serif; font-size:58px; line-height:.92;
  background:linear-gradient(96deg,var(--blue-1) 10%,var(--blue-2)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:6px 0 8px; }
.nmm__sub{ text-align:center; color:var(--muted); font-size:12.5px; line-height:1.5; margin:0 auto 20px; max-width:230px; }
.nmm__cards{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
.nmm__card{ border:1px solid var(--line); border-radius:12px; background:var(--card); padding:12px 12px 13px; display:flex; flex-direction:column; gap:10px; }
.nmm__card .nmm__ic{ width:19px; height:19px; color:var(--terra); }
.nmm__card .t{ font-size:12.5px; line-height:1.25; min-width:0; overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto; }
.nmm__all{ text-align:center; margin:16px 0 0; color:var(--muted); font-size:12.5px; }
.nmm__all b{ color:var(--terra); font-weight:500; }

.nmm__composer{ margin:auto 8px 8px; border:1.5px solid var(--line-2); border-radius:18px; background:var(--card); padding:11px 13px 8px; box-shadow:0 8px 22px -16px rgba(80,50,20,.4); }
.nmm__cin{ min-height:34px; font-size:13px; line-height:1.4; color:var(--ink); }
.nmm__cin .ph{ color:var(--faint); }
.nmm__cur{ display:inline-block; width:2px; height:15px; background:var(--terra); vertical-align:-2px; margin-left:1px; animation:nmm-blink 1.1s steps(1) infinite; }
@keyframes nmm-blink{50%{opacity:0}}
.nmm__crow{ display:flex; align-items:center; gap:10px; margin-top:9px; color:var(--muted); }
.nmm__chip{ font:11px var(--mono); color:#52525B; display:flex; align-items:center; gap:5px; }
.nmm__chip .nmm__ic{ width:13px; height:13px; color:var(--terra); }
.nmm__crow .send{ margin-left:auto; width:31px; height:31px; border-radius:50%; background:var(--ink); color:var(--cream); display:grid; place-items:center; }
.nmm__crow .send .nmm__ic{ width:15px; height:15px; stroke-width:2; }
.nmm__crow .mic .nmm__ic{ width:17px; height:17px; }

.nmm__foot{ display:flex; align-items:center; justify-content:center; gap:7px; padding:7px 0 9px; font:10.5px var(--mono); color:var(--muted); border-top:1px solid var(--line); }
.nmm__foot .dot{ width:6px;height:6px;border-radius:50%;background:var(--green); animation:nmm-pulse 2.4s infinite; box-shadow:0 0 0 0 rgba(57,176,106,.5); }
@keyframes nmm-pulse{70%{box-shadow:0 0 0 6px rgba(57,176,106,0)}100%{box-shadow:0 0 0 0 rgba(57,176,106,0)}}

.nmm__splash{ position:absolute; inset:0; z-index:10; background:var(--cream); display:grid; place-items:center; transition:opacity .6s; }
.nmm__splash.gone{ opacity:0; pointer-events:none; }
.nmm__conn{ font:12px var(--mono); letter-spacing:.3em; color:var(--terra); display:flex; align-items:center; gap:10px; }
.nmm__hatch{ width:12px;height:12px; background:repeating-linear-gradient(45deg,var(--terra) 0 2px,transparent 2px 4px); animation:nmm-blink 1s steps(1) infinite; }
@media (prefers-reduced-motion:reduce){ .nmm__cur,.nmm__hatch,.nmm__foot .dot{ animation:none; } }

    for(var c=n.firstChild;c;c=c.nextSibling) walk(c);
  }
  function take(rs){
    for(var i=0;i<rs.length;i++){
      var r=rs[i];
      if(r.type==='characterData'){ if(r.target.nodeType===3) doText(r.target); }
      else if(r.type==='attributes') doAttrs(r.target);
      else for(var j=0;j<r.addedNodes.length;j++) walk(r.addedNodes[j]);
    }
  }
  function kids(){
    var fs=document.getElementsByTagName('iframe');
    for(var i=0;i<fs.length;i++){ try{ fs[i].contentWindow.postMessage({hcLang:cur},'*'); }catch(e){} }
  }
  function setLang(l){
    if(l!=='ru' && !LANGS.hasOwnProperty(l)) return;
    if(l===cur) return;
    if(mo) take(mo.takeRecords());
    ridx=idx; cur=l; idx=(l==='ru')?-1:LANGS[l];
    walk(document.documentElement);
    ridx=idx;
    document.documentElement.setAttribute('lang',l);
    var bd=document.getElementById('hc-i18n-bidi');
    if(l==='ar' && !bd){ bd=document.createElement('style'); bd.id='hc-i18n-bidi';
      bd.textContent='body,body *{unicode-bidi:plaintext}'; (document.head||document.documentElement).appendChild(bd); }
    else if(l!=='ar' && bd) bd.parentNode.removeChild(bd);
    if(!mo && window.MutationObserver){
      mo=new MutationObserver(take);
      mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTRS});
    }
    kids();
  }
  window.__hcLangQ=function(){ return cur==='ru' ? '' : '&lang='+cur; };
  window.addEventListener('message',function(e){
    var d=e.data; if(!d || typeof d!=='object') return;
    if(d.hcLangReq===1 && e.source && e.source!==window.parent){ try{ e.source.postMessage({hcLang:cur},'*'); }catch(x){} return; }
    if(typeof d.hcLang==='string' && e.source===window.parent) setLang(d.hcLang);
  });
  var q=/[?&#]lang=([a-z]{2})\b/.exec(location.search+location.hash);
  if(q) setLang(q[1]);
  if(window.parent!==window){ try{ window.parent.postMessage({hcLangReq:1},'*'); }catch(e){} }
})();
</script>
